<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Guides | Fynna Montaño</title><meta name="description" content="A practical look at how Fynna plans and executes social media, email marketing, website management and e-commerce operations."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="guides"><main id="main"><div class="banner"><div class="wrap"><div class="kicker">Work guides</div><h1>How I turn a brief into work that gets done.</h1><p>A transparent look at my usual execution process, from planning and production to quality checks and reporting.</p></div></div><section><div class="wrap"><div class="guide-layout"><div class="guide-tabs" role="tablist" aria-label="Work process guides"><button class="guide-tab active" data-tab="social" role="tab" aria-selected="true">01 · Social media</button><button class="guide-tab" data-tab="email" role="tab" aria-selected="false">02 · Email marketing</button><button class="guide-tab" data-tab="web" role="tab" aria-selected="false">03 · Website management</button><button class="guide-tab" data-tab="ecom" role="tab" aria-selected="false">04 · E-commerce operations</button></div><div class="guide-panel" id="guide-panel" role="tabpanel"></div></div></div></section><div id="cta"></div></main><script src="data/site.js"></script><script src="data/services.js"></script><script src="data/experience.js"></script><script src="data/portfolio.js"></script><script src="data/cases.js"></script><script src="data/testimonials.js"></script><script src="js/main.js"></script><script>
(function(){var data={social:{title:'Social media management',intro:'I manage social media as an ongoing cycle, not a queue of posts. The aim is to keep the brand consistent while learning what content earns attention and action.',steps:[['01 · Audit','Review brand positioning, platforms, existing content, competitors and current performance.'],['02 · Strategy','Set content pillars, tone of voice, audience focus, formats and monthly priorities.'],['03 · Calendar','Build a content calendar with dates, formats, captions, creative direction and approval status.'],['04 · Production','Create or coordinate graphics, carousels, reels, stories, captions and platform adaptations.'],['05 · Publishing','Schedule approved posts, check links and tags, and confirm that each post displays correctly.'],['06 · Community','Monitor comments, messages and mentions, escalating customer or sensitive issues when needed.'],['07 · Reporting','Review reach, views, engagement, profile activity and top-performing content, then recommend changes.']]},email:{title:'Email marketing',intro:'Email execution starts with the audience and the purpose of the send. I work through campaign planning, design, build, QA and post-send analysis.',steps:[['01 · Brief & objective','Confirm campaign purpose, audience, offer, key message, CTA and desired action.'],['02 · Audience & segment','Check list source, consent, suppression rules, customer status and relevant segments.'],['03 · Copy & design','Write subject line, preview text and body copy, then build a responsive layout aligned with the brand.'],['04 · Build & links','Set sender details, tracking, UTM parameters, dynamic content, links and any personalization.'],['05 · QA & test','Review desktop and mobile, proofread, test every link, verify images, check rendering and send test emails.'],['06 · Schedule & send','Confirm audience, exclusions, timing, time zone and final approval before scheduling or sending.'],['07 · Measure','Review delivery, opens, clicks, conversions, unsubscribes and revenue where tracking is available.']]},web:{title:'Website management · e-commerce, B2B and B2C',intro:'Website work is a combination of customer experience, accurate information and operational upkeep. The exact checks depend on the platform and business model.',steps:[['01 · Request & scope','Clarify the change, audience, page or product affected, deadline and approval owner.'],['02 · Content & assets','Prepare copy, product details, images, links, metadata and supporting files.'],['03 · Build & update','Update pages, navigation, landing pages, forms, banners, product content or B2B information.'],['04 · Responsive QA','Check mobile and desktop layouts, buttons, forms, navigation, links and page loading.'],['05 · Functional checks','Test enquiry forms, account journeys, checkout paths or gated content as relevant.'],['06 · Publish','Confirm approvals, publish changes and verify the live page.'],['07 · Maintain','Track requested changes, broken links, outdated content and recurring site issues.']]},ecom:{title:'E-commerce operations',intro:'I support the operational work behind an online store, keeping product information, stock, orders and fulfilment details organised and accurate.',steps:[['01 · Product listings','Create or update titles, descriptions, variants, SKUs, pricing, attributes, images and collections.'],['02 · Inventory','Update stock quantities, monitor low-stock items, reconcile discrepancies and flag unavailable products.'],['03 · Orders','Review new orders, payment status, customer details, fulfilment status and exceptions.'],['04 · Shipping','Prepare fulfilment details, shipping labels or tracking information and coordinate dispatch updates.'],['05 · Customer support','Handle routine order, delivery, return and product enquiries using approved policies.'],['06 · Store checks','Review promotions, product visibility, checkout issues, pricing consistency and out-of-stock behaviour.'],['07 · Reporting','Summarise orders, sales, inventory movement, fulfilment issues and recurring operational gaps.']]}};var tabs=[].slice.call(document.querySelectorAll('.guide-tab'));var panel=document.getElementById('guide-panel');function show(k){var d=data[k];panel.innerHTML='<div class="kicker">Execution framework</div><h3>'+d.title+'</h3><p>'+d.intro+'</p><div class="guide-steps">'+d.steps.map(function(s){return '<div class="guide-step"><b>'+s[0]+'</b><p>'+s[1]+'</p></div>'}).join('')+'</div><div class="guide-flow">'+d.steps.map(function(s,i){return (i?'<i>→</i>':'')+'<span>'+s[0].split(' · ')[1]+'</span>'}).join('')+'</div>';tabs.forEach(function(b){var on=b.dataset.tab===k;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')})}tabs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.tab)})});show('social')})();
</script></body></html>
